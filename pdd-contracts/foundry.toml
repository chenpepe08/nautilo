[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.24"
optimizer = true
optimizer_runs = 200
via_ir = true
evm_version = "paris"
ffi = false
fs_permissions = [{ access = "read-write", path = "./deployments" }]

[rpc_endpoints]
bsc_testnet = "${BSC_TESTNET_RPC_URL}"
bsc_mainnet = "${BSC_MAINNET_RPC_URL}"

[etherscan]
bsc_testnet = { key = "${BSCSCAN_API_KEY}", url = "https://api-testnet.bscscan.com/api" }

# Mainnet profile is gated — do not use unless explicitly authorized.
[profile.mainnet_gated]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.24"
